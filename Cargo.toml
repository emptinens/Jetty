[package]
name = "jetty"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GUI AI agent orchestrator: terminal sessions running any CLI"
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "ba8159b4d324d137e08993d85fb023b484388ede" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ba8159b4d324d137e08993d85fb023b484388ede", features = ["wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"